x-python: &python
  build: .
  environment: &database
    MYSQL_HOST: db
    MYSQL_DATABASE: ${MYSQL_DATABASE:-ama_rs}
    MYSQL_USER: ${MYSQL_USER:-ama_rs}
    MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}

x-messenger: &messenger
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-}

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ama_rs}
      MYSQL_USER: ${MYSQL_USER:-ama_rs}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u \"$$MYSQL_USER\" -D \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  migrate:
    <<: *python
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  app:
    <<: *python
    environment:
      <<: [*messenger, *database]
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      MAX_WEBHOOK_SECRET: ${MAX_WEBHOOK_SECRET:-}
      IIKO_WEBHOOK_SECRET: ${IIKO_WEBHOOK_SECRET:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/healthz', timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    <<: *python
    profiles: ["integrations"]
    command: ["python", "-m", "ama_rs.delivery_worker"]
    environment:
      <<: [*messenger, *database]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  mysql-data:
